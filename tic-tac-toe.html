<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALXE TIC-TAC-TOE</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Tahoma,Arial,sans-serif;
  background:radial-gradient(circle at top,#25345d,#0c1020 60%);
  color:#fff; display:flex; justify-content:center; align-items:center; padding:18px;
}
.app{width:min(100%,1050px)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.logo{font-size:clamp(22px,5vw,38px);font-weight:900;letter-spacing:1px}
.logo span{color:#67e8f9}
.badge{padding:8px 12px;border:1px solid #ffffff22;border-radius:999px;background:#ffffff0d}
.grid{display:grid;grid-template-columns:1fr 320px;gap:16px}
.card{background:#11182bdb;border:1px solid #ffffff14;border-radius:22px;padding:18px;box-shadow:0 18px 50px #0006}
.board{width:min(82vw,500px);aspect-ratio:1;margin:10px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{
  border:0;border-radius:18px;background:#1c2741;color:white;
  font-size:clamp(48px,13vw,90px);font-weight:900;cursor:pointer;
  transition:.15s; box-shadow:inset 0 0 0 1px #ffffff08;
}
.cell:hover{transform:translateY(-2px);background:#243454}
.cell.x{color:#67e8f9}.cell.o{color:#f9a8d4}
.status{text-align:center;font-size:20px;font-weight:700;min-height:30px}
button.action{
  width:100%;padding:13px;border:0;border-radius:13px;margin-top:9px;
  background:#67e8f9;color:#07101d;font-size:16px;font-weight:900;cursor:pointer
}
button.secondary{background:#263552;color:#fff}
input,select{
  width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff20;
  background:#0b1120;color:#fff;margin:7px 0;font-size:15px
}
hr{border:0;border-top:1px solid #ffffff12}
.boardWrap{position:relative;width:min(82vw,500px);aspect-ratio:1;margin:10px auto}
.board{width:100%;height:100%;margin:0}
.winLine{
  display:none;position:absolute;z-index:5;height:8px;background:#fff;border-radius:99px;
  transform-origin:left center;box-shadow:0 0 18px #fff;pointer-events:none
}
.winLine.show{display:block;animation:lineIn .3s ease-out}
@keyframes lineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cell.win{background:#34496f}
@media(max-width:760px){.grid{grid-template-columns:1fr}.side{order:-1}}
h2{margin-top:0}.small{color:#aab6d1;font-size:13px;line-height:1.8}
.score{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.score div{text-align:center;background:#0b1120;padding:10px;border-radius:12px}
.score b{display:block;font-size:22px;margin-top:4px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.side{order:-1}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">🌌 GALXE <span>TIC-TAC-TOE</span></div>
  <div class="badge" id="modeBadge">👥 دو نفره</div>
</header>

<div class="grid">
  <main class="card">
    <div class="status" id="status">نوبت X</div><div class="small" style="text-align:center;margin-top:4px">هر نوبت فقط یک مهره بگذار؛ مهره‌ها حذف نمی‌شوند.</div>
    <div class="score">
      <div id="xScoreLabel">X<b id="sx">0</b></div>
      <div>مساوی<b id="sd">0</b></div>
      <div id="oScoreLabel">O<b id="so">0</b></div>
    </div>
    <div class="boardWrap">
      <div class="winLine" id="winLine"></div>
      <div class="board" id="board"></div>
    </div>
    <button class="action" onclick="newGame()">🔄 بازی بعدی</button>
    <button class="action secondary" onclick="fullRestart()">🗑️ ری‌استارت کامل</button>
  </main>

  <aside class="card side">
    <h2>🎮 حالت بازی</h2>
    <button class="action" onclick="setMode('local')">👥 دو نفره نوبتی</button>
    <button class="action secondary" onclick="setMode('ai')">🤖 بازی نوبتی با ربات</button>
    <div id="difficultyBox" style="display:none;margin-top:12px">
      <label class="small">درجه سختی ربات</label>
      <select id="difficulty" onchange="setDifficulty(this.value)">
        <option value="easy">آسان 😴</option>
        <option value="medium" selected>متوسط 😎</option>
        <option value="hard">سخت 🔥</option>
      </select>
    </div>
    <hr style="border-color:#ffffff12;margin:18px 0">
    <h2>🌐 آنلاین</h2>
    <p class="small">
      یک کد اتاق بساز یا کد دوستت را وارد کن. برای بازی آنلاین، هر دو نفر باید این صفحه را باز کنند.
    </p>
    <input id="room" maxlength="12" placeholder="کد اتاق">
    <button class="action" onclick="createOnlineRoom()">🏠 ساخت اتاق و دریافت کد</button>
    <button class="action secondary" onclick="joinOnlineRoom()">🚀 ورود به اتاق</button>
    <button class="action secondary" onclick="copyRoomCode()">📋 کپی کد اتاق</button>
    <button class="action secondary" onclick="leaveOnlineRoom()">🔌 قطع اتصال</button>
    <p class="small" id="onlineStatus">وضعیت: آفلاین</p>
    <p class="small">💾 امتیازها در همین مرورگر ذخیره می‌شوند.</p>
  </aside>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const SIZE=3, WIN=3;
const boardEl=document.getElementById('board');
const statusEl=document.getElementById('status');
const winLine=document.getElementById('winLine');

let board=Array(9).fill('');
let turn='X', mode='local', over=false, difficulty='medium';

// Online state: X is the room host, O is the player who joins.
let peer=null, connection=null, onlineRole=null, onlineRoom='', onlineReady=false;

// Each game mode has its own score key.
// This prevents local/AI/online scores from ever sharing or overwriting each other.
const SCORE_KEYS={
  local:'galxe_scores_local',
  ai:'galxe_scores_ai',
  online:'galxe_scores_online'
};

function emptyScore(){
  return {X:0,O:0,D:0};
}

function readScore(modeName){
  try{
    const raw=localStorage.getItem(SCORE_KEYS[modeName]);
    const value=raw ? JSON.parse(raw) : null;
    return value && typeof value==='object'
      ? {
          X:Number(value.X)||0,
          O:Number(value.O)||0,
          D:Number(value.D)||0
        }
      : emptyScore();
  }catch(e){
    return emptyScore();
  }
}

let scores={
  local:readScore('local'),
  ai:readScore('ai'),
  online:readScore('online')
};

function currentScores(){
  return scores[mode] || emptyScore();
}

function save(){
  localStorage.setItem(SCORE_KEYS[mode],JSON.stringify(currentScores()));
}

function render(){
  boardEl.innerHTML='';
  board.forEach((v,i)=>{
    const b=document.createElement('button');
    b.className='cell '+(v?v.toLowerCase():'');
    b.textContent=v;
    b.onclick=()=>play(i);
    boardEl.appendChild(b);
  });
  const s=currentScores();
  document.getElementById('sx').textContent=s.X;
  document.getElementById('so').textContent=s.O;
  document.getElementById('sd').textContent=s.D;
  statusEl.textContent=over?'بازی تمام شد!':'نوبت '+turn;
}

function getWinLine(){
  const lines=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  return lines.find(([a,b,c]) =>
    board[a] && board[a]===board[b] && board[a]===board[c]
  ) || null;
}

function drawWinLine(line){
  if(!line)return;
  line.forEach(i=>boardEl.children[i].classList.add('win'));

  const a=line[0], c=line[2];
  // Use the real rendered cell centers, so the line stays aligned
  // on every screen size, including mobile.
  const wrap = document.querySelector('.boardWrap');
  const first = boardEl.children[a];
  const last = boardEl.children[c];
  if(!wrap || !first || !last)return;

  const wr = wrap.getBoundingClientRect();
  const ar = first.getBoundingClientRect();
  const cr = last.getBoundingClientRect();

  const x1 = ar.left - wr.left + ar.width / 2;
  const y1 = ar.top - wr.top + ar.height / 2;
  const x2 = cr.left - wr.left + cr.width / 2;
  const y2 = cr.top - wr.top + cr.height / 2;
  const dx = x2 - x1, dy = y2 - y1;

  winLine.style.left = x1 + 'px';
  winLine.style.top = y1 + 'px';
  winLine.style.width = Math.hypot(dx,dy) + 'px';
  winLine.style.transform = `rotate(${Math.atan2(dy,dx)}rad) translateY(-50%)`;
  winLine.classList.add('show');
}

function finishOrNext(){
  const line=getWinLine();

  if(line){
    currentScores()[turn]++;
    save();
    over=true;
    render();
    drawWinLine(line);
    return;
  }

  if(board.every(Boolean)){
    currentScores().D++;
    save();
    over=true;
    render();
    return;
  }

  turn=turn==='X'?'O':'X';
  render();
}

function play(i){
  if(over || board[i] || (mode==='ai' && turn==='O')) return;
  if(mode==='online' && (!connection || !onlineReady || onlineRole !== turn)) return;

  board[i]=turn;
  finishOrNext();

  if(mode==='online'){
    sendOnlineState();
    return;
  }

  if(!over && mode==='ai' && turn==='O')
    setTimeout(aiMove,300);
}

function aiMove(){
  const empty=board.map((v,i)=>v?null:i).filter(i=>i!==null);
  if(!empty.length)return;

  if(difficulty==='easy'){
    board[empty[Math.floor(Math.random()*empty.length)]]='O';
    finishOrNext();
    return;
  }

  // برد فوری
  for(const i of empty){
    board[i]='O';
    if(getWinLine()){finishOrNext();return;}
    board[i]='';
  }

  // جلوگیری از برد بازیکن
  for(const i of empty){
    board[i]='X';
    if(getWinLine()){
      board[i]='O';
      finishOrNext();
      return;
    }
    board[i]='';
  }

  // متوسط/سخت: مرکز، گوشه، سپس خانه آزاد
  const preferred=[4,0,2,6,8,1,3,5,7];
  const pick=preferred.find(i=>!board[i]);
  board[pick]='O';
  finishOrNext();
}

function setDifficulty(v){difficulty=v;}

function setMode(m){
  if(mode==='online' && m!=='online') leaveOnlineRoom();

  mode=m;
  document.getElementById('modeBadge').textContent =
    m==='ai' ? '🤖 بازی نوبتی با ربات' :
    m==='online' ? '🌐 بازی آنلاین' : '👥 دو نفره نوبتی';

  document.getElementById('difficultyBox').style.display =
    m==='ai' ? 'block' : 'none';

  newGame();

  if(m==='online'){
    setOnlineStatus('برای بازی آنلاین، اتاق بسازید یا وارد یک اتاق شوید.');
  }
}


function setOnlineStatus(text){
  const el=document.getElementById('onlineStatus');
  if(el) el.textContent='وضعیت: '+text;
}

function randomRoomCode(){
  return Math.random().toString(36).slice(2,8).toUpperCase();
}

function createOnlineRoom(){
  if(mode!=='online') setMode('online');
  leaveOnlineRoom(true);

  const input=document.getElementById('room');
  const room=(input.value.trim() || randomRoomCode()).toUpperCase();
  input.value=room;

  onlineRoom=room;
  onlineRole='X';
  onlineReady=false;
  newGame();

  // The room code IS the host Peer ID, so the second player can
  // deterministically connect to exactly this room.
  const peerId='galxe-ttt-'+room;
  peer=new Peer(peerId,{debug:0});

  peer.on('open',()=>{
    setOnlineStatus('اتاق ساخته شد. کد: '+room+' — منتظر بازیکن دوم...');
  });

  peer.on('connection',conn=>{
    if(connection && connection.open){ conn.close(); return; }
    connection=conn;
    setupConnection();
  });

  peer.on('error',err=>{
    console.error('PeerJS host error:',err);
    if(err && err.type==='unavailable-id'){
      setOnlineStatus('این کد اتاق قبلاً استفاده شده؛ کد دیگری انتخاب کنید.');
    }else{
      setOnlineStatus('خطا در ساخت اتاق؛ اتصال اینترنت را بررسی کنید.');
    }
  });
}

function joinOnlineRoom(){
  if(mode!=='online') setMode('online');
  leaveOnlineRoom(true);

  const input=document.getElementById('room');
  const room=input.value.trim().toUpperCase();

  if(!room){
    setOnlineStatus('کد اتاق را وارد کنید.');
    input.focus();
    return;
  }

  onlineRoom=room;
  onlineRole='O';
  onlineReady=false;
  newGame();

  peer=new Peer({debug:0});

  peer.on('open',()=>{
    setOnlineStatus('در حال اتصال به اتاق '+room+'...');
    connection=peer.connect('galxe-ttt-'+room, {
      reliable:true,
      serialization:'json'
    });
    setupConnection();
  });

  peer.on('error',err=>{
    console.error('PeerJS join error:',err);
    setOnlineStatus('اتصال برقرار نشد؛ کد اتاق را بررسی کنید.');
  });

  setTimeout(()=>{
    if(peer && connection && !connection.open)
      setOnlineStatus('اتصال برقرار نشد؛ کد اتاق و اینترنت را بررسی کنید.');
  },10000);
}

function setupConnection(){
  if(!connection) return;

  connection.on('open',()=>{
    onlineReady=true;
    if(onlineRole==='X'){
      sendOnlineState();
      setOnlineStatus('بازیکن دوم وصل شد؛ نوبت شما (X)');
    }else{
      setOnlineStatus('متصل شد؛ نوبت حریف (X)');
    }
    render();
  });

  connection.on('data',data=>{
    if(!data || data.type!=='state' || !Array.isArray(data.board) || data.board.length!==9) return;

    board=data.board.slice();
    turn=data.turn==='O' ? 'O' : 'X';
    over=Boolean(data.over);

    if(data.scores && typeof data.scores==='object'){
      scores.online={
        X:Number(data.scores.X)||0,
        O:Number(data.scores.O)||0,
        D:Number(data.scores.D)||0
      };
      localStorage.setItem(
        SCORE_KEYS.online,
        JSON.stringify(scores.online)
      );
    }

    winLine.classList.remove('show');
    winLine.style.width='0';
    render();

    const line=getWinLine();
    if(line) drawWinLine(line);

    setOnlineStatus(
      over ? 'بازی تمام شد.' :
      (turn===onlineRole ? 'نوبت شما' : 'نوبت حریف')
    );
  });

  connection.on('close',()=>{
    onlineReady=false;
    setOnlineStatus('ارتباط با حریف قطع شد.');
  });

  connection.on('error',err=>{
    console.error('Data connection error:',err);
    onlineReady=false;
    setOnlineStatus('خطا در ارتباط با حریف.');
  });
}

function sendOnlineState(){
  if(mode==='online' && connection && connection.open){
    connection.send({
      type:'state',
      board:board.slice(),
      turn:turn,
      over:over,
      scores:{
        X:scores.online.X,
        O:scores.online.O,
        D:scores.online.D
      }
    });
  }
}

function copyRoomCode(){
  const room=document.getElementById('room').value.trim();
  if(!room){ setOnlineStatus('ابتدا یک اتاق بسازید.'); return; }

  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(room)
      .then(()=>setOnlineStatus('کد اتاق کپی شد: '+room))
      .catch(()=>setOnlineStatus('کد اتاق: '+room));
  }else{
    setOnlineStatus('کد اتاق: '+room);
  }
}

function leaveOnlineRoom(silent=false){
  if(connection){ try{connection.close();}catch(e){} }
  if(peer){ try{peer.destroy();}catch(e){} }

  connection=null;
  peer=null;
  onlineReady=false;
  onlineRole=null;
  onlineRoom='';

  if(!silent) setOnlineStatus('آفلاین');
}

function newGame(){
  board=Array(9).fill('');
  turn='X';
  over=false;
  winLine.classList.remove('show');
  winLine.style.width='0';
  render();

  if(mode==='online' && onlineReady && onlineRole==='X'){
    sendOnlineState();
  }
}

function fullRestart(){
  if(confirm('امتیازهای هر دو حالت پاک شوند و بازی از اول شروع شود؟')){
    scores={local:emptyScore(),ai:emptyScore(),online:emptyScore()};
    localStorage.removeItem(SCORE_KEYS.local);
    localStorage.removeItem(SCORE_KEYS.ai);
    localStorage.removeItem(SCORE_KEYS.online);
    newGame();
  }
}

render();
</script>
</body>
</html>
